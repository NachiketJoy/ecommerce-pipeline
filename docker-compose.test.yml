version: '3.8'

services:
  product-service-test:
    build: ./backend/product_service
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  order-service-test:
    build: ./backend/order_service
    ports:
      - "8001:8000"
    environment:
      - PYTHONPATH=/app
      - PRODUCT_SERVICE_URL=http://product-service-test:8000
    depends_on:
      product-service-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend-test:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - product-service-test
      - order-service-test

networks:
  default:
    driver: bridge