
# Simplified Test Environment - API Only

services:
  # Product Service for Testing
  product-service-test:
    image: simplified_product_service:latest
    container_name: product_service_test_container
    ports:
      - "8000:8000"
    environment:
      AZURE_STORAGE_ACCOUNT_NAME: testaccount
      AZURE_STORAGE_ACCOUNT_KEY: testkey
      AZURE_STORAGE_CONTAINER_NAME: test-images
      AZURE_SAS_TOKEN_EXPIRY_HOURS: 1
    volumes:
      - ./test-reports:/app/test-reports
    networks:
      - ecommerce_test_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Order Service for Testing
  order-service-test:
    image: simplified_order_service:latest
    container_name: order_service_test_container
    ports:
      - "8001:8000"
    environment:
      PRODUCT_SERVICE_URL: http://product-service-test:8000
    volumes:
      - ./test-reports:/app/test-reports
    depends_on:
      product-service-test:
        condition: service_healthy
    networks:
      - ecommerce_test_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Frontend for Testing
  frontend-test:
    image: simplified_frontend:latest
    container_name: frontend_test_container
    ports:
      - "3000:80"
    depends_on:
      product-service-test:
        condition: service_healthy
      order-service-test:
        condition: service_healthy
    networks:
      - ecommerce_test_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  ecommerce_test_network:
    driver: bridge
