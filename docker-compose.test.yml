version: '3.8'

services:
  product-service-test:
    build: ./backend/product_service
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app

  order-service-test:
    build: ./backend/order_service
    ports:
      - "8001:8000"
    environment:
      - PYTHONPATH=/app
      - PRODUCT_SERVICE_URL=http://product-service-test:8000
    depends_on:
      - product-service-test

  frontend-test:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - product-service-test
      - order-service-test

networks:
  default:
    driver: bridge