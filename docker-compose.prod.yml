# Simplified Production Environment - Monolithic Architecture

version: "3.8"

services:
  # Backend Service for Production
  backend-prod:
    image: backend:latest
    container_name: backend_prod_container
    restart: always
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME}
      AZURE_STORAGE_ACCOUNT_KEY: ${AZURE_STORAGE_ACCOUNT_KEY}
      LOG_LEVEL: INFO
    networks:
      - ecommerce_prod_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend for Production
  frontend-prod:
    image: frontend:latest
    container_name: frontend_prod_container
    restart: always
    ports:
      - "3000:80"
    depends_on:
      backend-prod:
        condition: service_healthy
    networks:
      - ecommerce_prod_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ecommerce_prod_network:
    driver: bridge
