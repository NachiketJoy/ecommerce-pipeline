version: '3.8'

services:
  product-service:
    build: ./backend/product_service
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  order-service:
    build: ./backend/order_service
    ports:
      - "8001:8000"
    environment:
      - PYTHONPATH=/app
      - PRODUCT_SERVICE_URL=http://product-service:8000
    depends_on:
      product-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - product-service
      - order-service

networks:
  default:
    driver: bridge