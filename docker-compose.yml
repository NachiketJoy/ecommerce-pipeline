version: '3.8'

services:
  product-service:
    build: ./backend/product_service
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app

  order-service:
    build: ./backend/order_service
    ports:
      - "8001:8000"
    environment:
      - PYTHONPATH=/app
      - PRODUCT_SERVICE_URL=http://product-service:8000
    depends_on:
      - product-service

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - product-service
      - order-service

networks:
  default:
    driver: bridge