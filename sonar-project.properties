# SonarQube Configuration for E-commerce Microservices

# Project Information
sonar.projectKey=ecommerce-microservices
sonar.projectName=E-commerce Microservices
sonar.projectVersion=1.0.0
sonar.organization=your-organization

# Source Code Configuration
sonar.sources=backend/
sonar.exclusions=**/tests/**,**/test_*,**/__pycache__/**,**/node_modules/**,**/venv/**,**/.venv/**

# Test Configuration
sonar.tests=backend/
sonar.test.inclusions=**/test_*.py,**/tests/**

# Coverage Reports
sonar.python.coverage.reportPaths=**/coverage.xml
sonar.python.xunit.reportPath=**/test-results-*.xml

# Language Configuration
sonar.python.version=3.9,3.10,3.11

# Code Quality Rules
sonar.qualitygate.wait=true

# Security Configuration
sonar.security.hotspots.reviewed=true

# Duplication Configuration
sonar.cpd.python.minimumtokens=100

# Complexity Configuration
sonar.python.complexity.threshold=15

# Maintainability Configuration
sonar.python.maintainability.threshold=0.8

# Reliability Configuration
sonar.python.reliability.threshold=0.9

# Security Configuration
sonar.python.security.threshold=0.9

# Additional Properties
sonar.sourceEncoding=UTF-8
sonar.python.pylint.reportPath=**/pylint-report.txt
sonar.python.bandit.reportPaths=**/bandit-report.json
